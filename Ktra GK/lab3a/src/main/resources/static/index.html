<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sinh viên</title>
    <meta http-equiv="refresh" content="0; url=/students.html">
    <style>
        :root { --ink: #18324b; --muted: #6d7d89; --brand: #087f8c; --line: #dbe5e7; --paper: #fff; --background: #eef6f5; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: linear-gradient(135deg, #e7f4f2, var(--background)); font-family: Arial, sans-serif; }
        main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 55px; }
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 26px; }
        .mark { display: grid; width: 48px; height: 48px; place-items: center; color: white; background: var(--brand); border-radius: 12px; font-weight: 700; box-shadow: 0 8px 18px rgba(8, 127, 140, .2); }
        .eyebrow { color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
        h1 { margin: 5px 0 0; font-size: clamp(28px, 5vw, 44px); }
        .panel { padding: 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 30px rgba(28, 65, 72, .08); }
        .panel-top { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 23px; }
        .status { min-height: 20px; margin: 6px 0 0; color: var(--muted); font-size: 14px; }
        .status.error { color: #bd493f; }
        button { border: 0; border-radius: 5px; padding: 10px 14px; color: white; background: var(--brand); cursor: pointer; font-weight: 700; }
        button:hover { background: #075c67; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { padding: 13px 11px; border-bottom: 1px solid var(--line); text-align: left; }
        th { color: #55717c; background: #f2f8f7; font-size: 12px; letter-spacing: .4px; text-transform: uppercase; }
        .empty { padding: 32px; color: var(--muted); text-align: center; }
        @media (max-width: 600px) { main { width: min(100% - 20px, 1120px); padding-top: 24px; } .panel { padding: 16px; } .panel-top { align-items: start; } th, td { padding: 10px 8px; } }
    </style>
</head>
<body>
<main>
    <header>
        <div class="mark">SV</div>
        <div><div class="eyebrow">LAB 3 · GET ALL API</div><h1>Danh sách sinh viên</h1></div>
    </header>

    <section class="panel">
        <div class="panel-top">
            <div><h2>Tất cả sinh viên</h2><p class="status" id="status">Đang tải danh sách...</p></div>
            <button type="button" id="reload">Tải lại</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Mã sinh viên</th><th>Họ và tên</th><th>Email</th><th>Số điện thoại</th><th>Lớp</th></tr>
                </thead>
                <tbody id="student-list"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const studentList = document.querySelector('#student-list');
    const status = document.querySelector('#status');

    function cell(value) {
        const element = document.createElement('td');
        element.textContent = value || '-';
        return element;
    }

    async function loadStudents() {
        status.className = 'status';
        status.textContent = 'Đang tải danh sách...';
        try {
            const response = await fetch('/api/students');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const students = await response.json();
            studentList.replaceChildren();
            if (!students.length) {
                const row = document.createElement('tr');
                const message = document.createElement('td');
                message.colSpan = 5;
                message.className = 'empty';
                message.textContent = 'Chưa có sinh viên.';
                row.appendChild(message);
                studentList.appendChild(row);
            } else {
                students.forEach(student => {
                    const row = document.createElement('tr');
                    row.append(cell(student.studentCode), cell(student.fullName), cell(student.email),
                        cell(student.phone), cell(student.className));
                    studentList.appendChild(row);
                });
            }
            status.textContent = `${students.length} sinh viên`;
        } catch (error) {
            status.className = 'status error';
            status.textContent = `Không thể tải danh sách: ${error.message}`;
        }
    }

    document.querySelector('#reload').addEventListener('click', loadStudents);
    loadStudents();
</script>
</body>
</html>
